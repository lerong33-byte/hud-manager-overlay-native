name: Build native overlay (installer, unsigned)

# Builds a real Velopack installer (Setup.exe + portable zip + update package) for the
# self-contained single-file HudManagerOverlay.exe (no .NET runtime required on the user's
# machine) and publishes it as a draft GitHub release on THIS repo, tagged vX.Y.Z from
# HudManagerOverlay.csproj's <Version>.
#
# Verified locally 2026-09-28: `vpk pack` produces a Setup.exe that installs to
# %LocalAppData%\HudManagerOverlay\current, creates a real desktop shortcut, and registers a
# proper "Programs and Features" uninstall entry. That local run hit a Bitdefender false-positive
# on the generated (unsigned) execution stub — a GitHub-hosted runner has no third-party AV, so
# this should not recur here, but if this job ever fails with an access-denied error on a file
# under a temp path, that's almost certainly the same class of issue on whatever runner image
# picked it up.
#
# NOT YET DONE (see PROGRESS.md "Not started" for the full list):
#   - Code signing. The exe and installer are unsigned — Windows SmartScreen will warn on first
#     run, and this is also why AV heuristics flag the generated stub (see above). The Electron
#     overlay (hud-manager-overlay-src) signs via Azure Trusted Signing; wiring the same service
#     up for this repo needs the AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET secrets
#     added here (they're scoped per-repo, not shared automatically).
#   - Auto-update client logic — Velopack is wired into the app (VelopackApp.Build().Run() in
#     App's constructor) and this workflow produces the update feed files (RELEASES,
#     releases.win.json, the -full.nupkg), but nothing in the app itself calls
#     UpdateManager.CheckForUpdatesAsync() yet, so it won't actually find/apply them.
#
# Defaults to a DRAFT release so a human verifies before anyone downloads it.

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Publish as a DRAFT release (true = test, not public)"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Velopack CLI (vpk)
        run: dotnet tool install -g vpk

      - name: Resolve version + tag
        id: ver
        shell: pwsh
        run: |
          $xml = [xml](Get-Content HudManagerOverlay/HudManagerOverlay.csproj)
          $version = $xml.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "pkg=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Output "Building $version"

      - name: Publish self-contained single-file build
        shell: pwsh
        run: |
          dotnet publish HudManagerOverlay/HudManagerOverlay.csproj `
            -c Release -r win-x64 --self-contained true `
            -o publish

      - name: Package installer (vpk)
        shell: pwsh
        run: |
          vpk pack `
            --packId HudManagerOverlay `
            --packVersion "${{ steps.ver.outputs.pkg }}" `
            --packDir publish `
            --packAuthors "H.U.D Manager" `
            --packTitle "H.U.D Manager Overlay" `
            --mainExe HudManagerOverlay.exe `
            --icon HudManagerOverlay/app.ico `
            --runtime win-x64 `
            --outputDir Releases

      - name: Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.ver.outputs.tag }}"
          DRAFT_FLAG=""
          if [ "${{ github.event.inputs.draft }}" != "false" ]; then DRAFT_FLAG="--draft"; fi
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" $DRAFT_FLAG \
              --title "$TAG" \
              --notes "Native overlay installer $TAG — UNSIGNED (SmartScreen + some antivirus will warn on the generated stub until code signing is set up). Run HudManagerOverlay-win-Setup.exe to install."
          fi
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
            Releases/HudManagerOverlay-win-Setup.exe \
            Releases/HudManagerOverlay-win-Portable.zip \
            "Releases/HudManagerOverlay-${{ steps.ver.outputs.pkg }}-full.nupkg" \
            Releases/RELEASES \
            Releases/releases.win.json
          echo "Uploaded installer + update feed to ${{ github.repository }} @ $TAG (draft=${{ github.event.inputs.draft }})"
